[package]
name = "tinsu"
version = "0.1.0"
edition = "2021"

[lib]
name = "tinsu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros"] }
sea-orm-migration = { version = "1", features = ["sqlx-sqlite"] }
tokio = { version = "1", features = ["full"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
async-trait = "0.1"
specta = { version = "=2.0.0-rc.24", features = ["derive"] }
specta-typescript = "=0.0.11"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
portable-pty = "0.9"
axum = "0.8.8"
tower-http = { version = "0.6", features = ["cors"] }
russh = { version = "0.60.0", default-features = false, features = ["ring", "rsa", "flate2"] }
ssh-key = { version = "0.6", features = ["ed25519", "encryption", "std"] }
rand = "0.8"
# keyring removed — replaced with file-based key storage (works cross-platform incl. WSL2)

[dev-dependencies]
tempfile = "3"

